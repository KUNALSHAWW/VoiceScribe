name = "voicescribe-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"

# This allows you to use the variable in your code
[vars]
# You can put a placeholder here, but for local dev 
# you should use .dev.vars (explained below)
# Compatibility flags for WebSocket support
# This enables the Worker to make outbound WebSocket connections to Soniox
compatibility_flags = ["nodejs_compat"]

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Environment variables (set via wrangler secret)
# Run: npx wrangler secret put SONIOX_API_KEY

# For local development, create a .dev.vars file with:
# SONIOX_API_KEY=your_api_key_here
